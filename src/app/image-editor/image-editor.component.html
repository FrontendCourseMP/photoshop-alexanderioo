<div class="editor">
  <app-editor-toolbar
    [hasImage]="hasImage()"
    [hasMask]="hasMask()"
    [showMasked]="showMasked()"
    [downloadButtons]="downloadButtons"
    [activeTool]="activeTool()"
    (fileSelected)="onFile($event)"
    (maskToggled)="toggleMask()"
    (toolSelected)="onToolSelected($event)"
    (levelsRequested)="openLevels()"
  />

  <div class="workspace">
    <main
      class="canvas-area"
      [class.eyedropper]="activeTool() === 'eyedropper'"
    >
      @if (!hasImage()) {
      <div class="empty">
        <p>Загрузите изображение в формате PNG, JPG или GB7</p>
      </div>
      }

      <div class="canvas-wrapper" [class.hidden]="!hasImage()">
        <canvas #canvas (click)="onCanvasClick($event)"></canvas>
      </div>
    </main>

    @if (hasImage()) {
    <app-channels-panel
      [thumbs]="channelThumbs()"
      [state]="channelState()"
      (channelToggled)="onChannelToggle($event)"
    />
    }
  </div>

  @if (activeTool() === 'eyedropper' && pixelInfo()) {
  <app-color-picker-info [pixel]="pixelInfo()" />
  }

  <app-editor-status-bar [info]="info()" />

  @if (levelsOpen() && levelsSource(); as src) {
  <app-levels-dialog
    [source]="src"
    [hasAlpha]="hasMask() || (info()?.depth ?? 0) >= 32"
    (settingsChange)="onLevelsPreview($event)"
    (applied)="onLevelsApply($event)"
    (cancelled)="onLevelsCancel()"
  />
  }
</div>
