<header class="toolbar">
  <label class="btn btn-primary">
    Загрузить изображение
    <input
      type="file"
      accept=".png,.jpg,.jpeg,.gb7,image/png,image/jpeg"
      (change)="fileSelected.emit($event)"
      hidden
    />
  </label>

  <button
    type="button"
    class="btn"
    [class.active]="activeTool() === 'eyedropper'"
    [disabled]="!hasImage()"
    (click)="
      toolSelected.emit(activeTool() === 'eyedropper' ? 'none' : 'eyedropper')
    "
    title="Пипетка"
  >
    🎯 Пипетка
  </button>

  @if (hasMask()) {
    <button
      type="button"
      class="btn"
      [class.active]="showMasked()"
      (click)="maskToggled.emit()"
    >
      {{ showMasked() ? "Скрыть маскированные" : "Показать маскированные" }}
    </button>
  }

  <button
    type="button"
    class="btn"
    [disabled]="!hasImage()"
    (click)="levelsRequested.emit()"
    title="Уровни"
  >
    Уровни
  </button>

  <button
    type="button"
    class="btn"
    [disabled]="!hasImage()"
    (click)="resizeRequested.emit()"
    title="Изменить размер"
  >
    Размер
  </button>

  <button
    type="button"
    class="btn"
    [disabled]="!hasImage()"
    (click)="convolutionRequested.emit()"
    title="Фильтры (свёртка)"
  >
    Фильтры
  </button>

  <div class="toolbar-group">
    @for (btn of downloadButtons(); track btn.label) {
      <button
        type="button"
        class="btn"
        [disabled]="!hasImage()"
        (click)="btn.action()"
      >
        {{ btn.label }}
      </button>
    }
  </div>
</header>
