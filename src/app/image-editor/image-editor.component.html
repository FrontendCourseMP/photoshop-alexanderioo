<div class="editor">
  <app-editor-toolbar
    [hasImage]="hasImage()"
    [hasMask]="hasMask()"
    [showMasked]="showMasked()"
    [downloadButtons]="downloadButtons"
    (fileSelected)="onFile($event)"
    (maskToggled)="toggleMask()"
  />

  <main class="canvas-area">
    @if (!hasImage()) {
    <div class="empty">
      <p>Загрузите изображение в формате PNG, JPG или GB7</p>
    </div>
    }

    <div class="canvas-wrapper" [class.hidden]="!hasImage()">
      <canvas #canvas></canvas>
    </div>
  </main>
  <app-editor-status-bar [info]="info()"></app-editor-status-bar>
</div>
