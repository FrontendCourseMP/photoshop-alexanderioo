<dialog #dlg class="levels-dialog" (close)="cancelled.emit()">
  <form method="dialog" (submit)="$event.preventDefault()">
    <header class="dlg-header">
      <h2>Уровни</h2>
    </header>

    <div class="row">
      <label>
        Канал:
        <select
          [value]="channel()"
          (change)="onChannelChange($any($event.target).value)"
        >
          @for (c of channels(); track c.value) {
          <option [value]="c.value">{{ c.label }}</option>
          }
        </select>
      </label>

      <label>
        Шкала:
        <select
          [value]="scale()"
          (change)="onScaleChange($any($event.target).value)"
        >
          <option value="linear">Линейная</option>
          <option value="log">Логарифмическая</option>
        </select>
      </label>
    </div>

    <div class="hist-wrapper">
      <canvas #histCanvas width="512" height="180"></canvas>
    </div>

    <div class="sliders">
      <label class="slider">
        <span>Чёрная точка: {{ current().blackPoint }}</span>
        <input
          type="range"
          min="0"
          max="254"
          step="1"
          [value]="current().blackPoint"
          (input)="onBlack(+$any($event.target).value)"
        />
      </label>

      <label class="slider">
        <span>Гамма: {{ current().gamma.toFixed(2) }}</span>
        <input
          type="range"
          min="0.1"
          max="9.9"
          step="0.01"
          [value]="current().gamma"
          (input)="onGamma(+$any($event.target).value)"
        />
      </label>

      <label class="slider">
        <span>Белая точка: {{ current().whitePoint }}</span>
        <input
          type="range"
          min="1"
          max="255"
          step="1"
          [value]="current().whitePoint"
          (input)="onWhite(+$any($event.target).value)"
        />
      </label>
    </div>

    <div class="row preview-row">
      <label class="preview">
        <input
          type="checkbox"
          [checked]="preview()"
          (change)="togglePreview($any($event.target).checked)"
        />
        Предпросмотр
      </label>
    </div>

    <footer class="dlg-footer">
      <button type="button" class="btn" (click)="onReset()">Сброс</button>
      <button type="button" class="btn" (click)="onCancel()">Отмена</button>
      <button type="button" class="btn btn-primary" (click)="onApply()">
        Применить
      </button>
    </footer>
  </form>
</dialog>
