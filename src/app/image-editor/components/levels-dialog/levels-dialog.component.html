<dialog #dlg class="levels-dialog" (close)="cancelled.emit()">
  <form method="dialog" (submit)="$event.preventDefault()">
    <header class="dlg-header">
      <h2>Уровни</h2>
    </header>

    <div class="row">
      <label>
        Канал:
        <select
          [value]="channel()"
          (change)="onChannelChange($any($event.target).value)"
        >
          @for (c of channels(); track c.value) {
          <option [value]="c.value">{{ c.label }}</option>
          }
        </select>
      </label>

      <label>
        Шкала:
        <select
          [value]="scale()"
          (change)="onScaleChange($any($event.target).value)"
        >
          <option value="linear">Линейная</option>
          <option value="log">Логарифмическая</option>
        </select>
      </label>
    </div>

    <div class="hist-wrapper">
      <canvas #histCanvas width="512" height="140"></canvas>
      <div class="markers-legend">
        <span
          ><i
            class="swatch"
            style="background: #000; border: 1px solid #fff"
          ></i>
          Чёрная точка</span
        >
        <span><i class="swatch" style="background: #888"></i> Гамма</span>
        <span
          ><i
            class="swatch"
            style="background: #fff; border: 1px solid #000"
          ></i>
          Белая точка</span
        >
      </div>
    </div>

    <!-- ✅ Новый общий трек с тремя маркерами -->
    <div class="levels-track" #track (mousedown)="onTrackMouseDown($event)">
      <div class="track-bar"></div>
      <div class="track-gradient"></div>

      <div
        class="marker marker-black"
        [style.left.%]="(current().blackPoint / 255) * 100"
        (mousedown)="startDrag($event, 'black')"
        title="Чёрная точка"
      ></div>

      <div
        class="marker marker-gamma"
        [style.left.%]="gammaMarkerPercent()"
        (mousedown)="startDrag($event, 'gamma')"
        title="Гамма"
      ></div>

      <div
        class="marker marker-white"
        [style.left.%]="(current().whitePoint / 255) * 100"
        (mousedown)="startDrag($event, 'white')"
        title="Белая точка"
      ></div>
    </div>

    <div class="values-row">
      <span
        >Чёрная: <b>{{ current().blackPoint }}</b></span
      >
      <span
        >Гамма: <b>{{ current().gamma.toFixed(2) }}</b></span
      >
      <span
        >Белая: <b>{{ current().whitePoint }}</b></span
      >
    </div>

    <div class="row preview-row">
      <label class="preview">
        <input
          type="checkbox"
          [checked]="preview()"
          (change)="togglePreview($any($event.target).checked)"
        />
        Предпросмотр
      </label>
    </div>

    <footer class="dlg-footer">
      <button type="button" class="btn" (click)="onReset()">Сброс</button>
      <button type="button" class="btn" (click)="onCancel()">Отмена</button>
      <button type="button" class="btn btn-primary" (click)="onApply()">
        Применить
      </button>
    </footer>
  </form>
</dialog>
